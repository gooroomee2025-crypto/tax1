<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세법 OX 퀴즈</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3DAE96">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div id="screen-home">
    <div class="topbar">
      <div>
        <div class="title">세법 OX 퀴즈</div>
        <div class="sub">2027 오정화 세법: 세법1 기준</div>
      </div>
      <div class="settings-btn" id="open-settings" title="환경설정">⚙️</div>
    </div>

    <div class="wrongnote-entry" id="open-wrongnote"><span class="ico">📖</span>오답노트</div>

    <div id="part-blocks"></div>
  </div>

  <!-- WRONGNOTE -->
  <div id="screen-wrongnote" class="hidden">
    <div class="topbar teal">
      <div class="left-group">
        <div class="back" id="wrongnote-back">‹</div>
        <div class="title">오답노트</div>
      </div>
    </div>
    <div id="wrongnote-list"></div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="hidden">
    <div class="topbar">
      <div class="left-group">
        <div class="back" id="quiz-back">‹</div>
        <div>
          <div class="title" id="quiz-title">6. 과세</div>
          <div class="sub">국세기본법</div>
        </div>
      </div>
    </div>
    <div class="quiz-wrap">
      <div class="quiz-meta">
        <span class="count" id="q-count">1 / 38</span>
        <span class="source" id="q-source"></span>
      </div>
      <div class="qtrack"><div class="qtrack-fill" id="qtrack-fill"></div></div>

      <div class="question-card">
        <div class="question-text" id="q-text"></div>
      </div>

      <div class="ox-row">
        <button class="ox-btn o" id="btn-o">O</button>
        <button class="ox-btn x" id="btn-x">X</button>
      </div>
      <div class="pass-row">
        <button class="pass-btn" id="btn-pass">PASS (모름 · 오답 처리)</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn">다음 문제</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="hidden">
    <div class="topbar">
      <div><div class="title">결과</div><div class="sub" id="result-chapter-name">국세기본법</div></div>
    </div>
    <div class="result-wrap">
      <div class="result-title">챕터를 완료했어요</div>
      <div class="result-score" id="result-score">0 / 38</div>
      <div class="result-sub" id="result-sub">정답률</div>
      <div class="result-complete" id="result-complete"></div>
      <button class="result-btn primary" id="retry-wrong">틀린 문제만 다시 풀기</button>
      <button class="result-btn secondary" id="retry-all">전체 다시 풀기</button>
      <button class="result-btn secondary" id="go-home">챕터 목록으로</button>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">환경설정</div>
        <div class="modal-close" id="close-settings">✕</div>
      </div>
      <div class="modal-body">
        <button class="reset-btn warning" id="reset-wrongnote">📖 오답노트 기록 초기화</button>
        <button class="reset-btn danger" id="reset-all-progress">🔄 전체 학습 기록 초기화</button>
      </div>
    </div>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
